<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>追问清单</title>
  <style>
    * { box-sizing: border-box; }
    body { width: 320px; margin: 0; padding: 18px; color: #302c38; background: #faf9fd; font: 13px/1.5 "Microsoft YaHei", system-ui, sans-serif; }
    h1 { margin: 0; font-size: 18px; }
    .sub { margin: 2px 0 14px; color: #817b8a; font-size: 11px; }
    .status { margin-bottom: 12px; padding: 10px 11px; border: 1px solid #e3dfec; border-radius: 10px; background: #fff; }
    .status strong { display: block; margin-bottom: 2px; }
    .status span { color: #777180; font-size: 11px; }
    button { width: 100%; padding: 9px 12px; color: #fff; background: #6d5ef7; border: 0; border-radius: 9px; font: 650 13px "Microsoft YaHei", system-ui, sans-serif; cursor: pointer; }
    button:hover { background: #5d4fe3; }
    details { margin-top: 12px; padding-top: 9px; border-top: 1px solid #e2deea; }
    summary { color: #5f586a; cursor: pointer; font-weight: 650; }
    label { display: block; margin-top: 9px; color: #706a7b; font-size: 11px; }
    input { width: 100%; margin-top: 4px; padding: 8px; color: #302c38; border: 1px solid #dcd7e6; border-radius: 8px; outline: none; }
    input:focus { border-color: #6d5ef7; box-shadow: 0 0 0 3px rgba(109,94,247,.1); }
    #settingsSave { margin-top: 9px; color: #5e5770; background: #ece9f2; }
    #settingsSave:hover { background: #e2deeb; }
    .setting-state { min-height: 16px; margin: 6px 0 0; color: #6d5ef7; font-size: 10px; }
    .privacy { margin: 7px 0 0; color: #8a8494; font-size: 10px; }
    .help { margin: 12px 0 0; color: #8a8494; font-size: 10px; }
    .sites { margin-top: 8px; color: #686271; font-size: 10px; }
  </style>
</head>
<body>
  <h1>追问清单</h1>
  <p class="sub">随手记录疑问，下一轮一键输入</p>
  <div class="status"><strong id="statusTitle">正在检查当前页面…</strong><span id="statusText">请稍候</span></div>
  <button id="mainButton" type="button">打开侧边栏</button>
  <details id="aiSettings">
    <summary>千问智能分析设置</summary>
    <label>Base URL
      <input id="baseUrl" type="url" autocomplete="off" placeholder="https://你的WorkspaceId.cn-beijing.maas.aliyuncs.com/compatible-mode/v1">
    </label>
    <label>新的 API Key
      <input id="apiKey" type="password" autocomplete="new-password" placeholder="已保存时可留空">
    </label>
    <button id="settingsSave" type="button">保存千问设置</button>
    <p class="setting-state" id="settingsState"></p>
    <p class="privacy">模型固定为 qwen3.8-max。生成思维导图时只发送问题文本、状态和匿名 ID；Key 仅保存在当前浏览器扩展的本地存储中，不会显示或导出。</p>
  </details>
  <p class="help">也可以按 Alt+Shift+Q。安装或更新后，已打开的模型页面需要刷新一次。</p>
  <p class="sites">支持 ChatGPT、Claude、Gemini、DeepSeek、Grok、Poe、Copilot、豆包和腾讯元宝。</p>
  <script src="popup.js"></script>
</body>
</html>
