name: 发布安装包

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[publish-release]')
    runs-on: ubuntu-latest

    steps:
      - name: 检出完整版本历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 确定发布标签
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$(git describe --tags --abbrev=0)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 校验标签与 manifest 版本一致
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [[ "$tag" != "v$manifest_version" ]]; then
            echo "tag $tag does not match manifest version $manifest_version" >&2
            exit 1
          fi

      - name: 运行发布前检查
        shell: bash
        run: |
          node scripts/test-site-adapters.mjs
          node scripts/test-question-store.mjs
          node scripts/validate.mjs

      - name: 生成扩展安装包与校验值
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          mkdir -p dist package
          git archive "$tag" \
            site-adapters.js \
            question-store.js \
            background.js \
            content.js \
            docx-export.js \
            manifest.json \
            PRIVACY.md \
            README.md \
            LICENSE \
            sidepanel.css \
            sidepanel.html \
            sidepanel.js \
            icons \
            vendor/jszip.min.js \
            vendor/JSZIP-LICENSE.md \
            | tar -x -C package
          (cd package && zip -r "../dist/question-queue-${tag}.zip" .)
          (cd dist && sha256sum "question-queue-${tag}.zip" > SHA256SUMS.txt)

      - name: 检查安装包内容完整
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          for entry in manifest.json question-store.js site-adapters.js content.js sidepanel.js icons/icon-128.png; do
            unzip -l "dist/question-queue-${tag}.zip" | grep -q "$entry" || {
              echo "missing $entry in release package" >&2
              exit 1
            }
          done

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "追问簿 · Question Queue $TAG" \
              --generate-notes
          fi
