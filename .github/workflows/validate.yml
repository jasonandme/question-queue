name: Validate extension

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check site-adapters.js
          node --check question-store.js
          node --check background.js
          node --check content.js
          node --check sidepanel.js
          node --check docx-export.js
      - name: Test site adapters
        run: node scripts/test-site-adapters.mjs
      - name: Test question store
        run: node scripts/test-question-store.mjs
      - name: Check manifest and repository hygiene
        run: node scripts/validate.mjs
      - name: Check generated icons are up to date
        run: |
          node scripts/make-icons.mjs
          git diff --exit-code -- icons
