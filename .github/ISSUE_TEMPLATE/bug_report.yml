name: Bug report
description: 报告可复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿粘贴真实对话、API Key、邮箱、账号信息或本机路径。使用虚构内容复现。
  - type: input
    id: version
    attributes:
      label: Question Queue 版本
      placeholder: 0.4.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器与版本
      placeholder: Edge 140
    validations:
      required: true
  - type: dropdown
    id: site
    attributes:
      label: 模型网站
      options: [ChatGPT, Claude, Gemini, DeepSeek, Grok, Poe, Copilot, 豆包, 腾讯元宝, 其他]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 使用虚构问题描述从打开页面到出现问题的步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

